<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Login | LegalConnect</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <!-- ================= LOGIN CONTAINER ================= -->

    <div class="login-container">

        <!-- Left side -->
        <div class="login-info">

            <h1>⚖️ LegalConnect</h1>

            <h2>Welcome Back!</h2>

            <p>
                Connect with lawyers, clients and legal
                opportunities through one platform.
            </p>

        </div>


        <!-- Right side - Login Form -->
        <div class="login-box">

            <h2>Login to your account</h2>

            <p class="subtitle">
                Enter your details to continue
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Remember + Forgot password -->
                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <!-- Login button -->
                <button type="submit" class="login-button">
                    Login
                </button>

            </form>


            <!-- Signup option -->
            <p class="signup-text">

                Don't have an account?

                <a href="#" id="signupLink">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <!-- Connect JavaScript -->
    <script src="login.js"></script>

</body>

</html>
